<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown 编辑器</title>
  <meta name="description" content="左写右看：Markdown 编辑与实时预览，原生 HTML、数学公式、语法高亮、滚动同步。" />

  <!-- 首屏前确定主题，避免闪白/闪黑 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("md-editor.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="/app.css" />

  <!-- MathJax v4 配置：在默认 \(...\) \[...\] 之外追加 $...$ 行内定界符（与参考页一致）
       ignoreHtmlClass: 跳过 CodeMirror 编辑区（.cm-content），公式源码只在预览排版，
       绝不改写编辑器内容（否则编辑器会把 LaTeX 渲染成公式） -->
  <script>
    window.MathJax = {
      options: { ignoreHtmlClass: "cm-content" },
      tex: { inlineMath: { "[+]": [["$", "$"]] } }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
</head>
<body>
  <main id="app">
    <section id="editorPane" aria-label="编辑器">
      <div id="toolbar" role="toolbar" aria-label="编辑工具">
        <button id="btnFormat" type="button" class="tb-btn" title="美化 HTML 缩进；无 HTML 时清理多余空白">格式化</button>
        <button id="btnWrap" type="button" class="tb-btn active" title="自动换行（默认开）；关闭后长行横向滚动">自动换行</button>
        <span class="tb-sep" aria-hidden="true"></span>
        <button id="btnCopy" type="button" class="tb-btn" title="复制编辑器的全部内容到剪贴板">复制</button>
        <button id="btnPaste" type="button" class="tb-btn" title="把剪贴板内容粘贴进来，替换（清空）编辑区当前内容">粘贴</button>
        <button id="btnClear" type="button" class="tb-btn" title="清空编辑区并删除已保存的草稿（需二次确认）">清空</button>
        <span class="tb-sep" aria-hidden="true"></span>
        <button id="btnTheme" type="button" class="tb-btn" title="切换亮暗主题">主题</button>
        <button id="btnSync" type="button" class="tb-btn active" title="编辑与预览滚动同步（默认开）">滚动同步</button>
        <span id="tbStatus" aria-live="polite"></span>
      </div>
      <div id="editor" aria-label="编辑器"></div>
    </section>

    <div
      id="divider"
      role="separator"
      aria-orientation="vertical"
      aria-label="拖动调整左右宽度，双击复位"
      title="拖动调整 · 双击复位 50/50"
    >
      <span id="grip" aria-hidden="true"></span>
    </div>

    <section id="previewPane" aria-label="预览">
      <article id="preview" class="markdown-body"></article>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
