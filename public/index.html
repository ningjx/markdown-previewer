<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>md.ink · Markdown 编辑器</title>
  <meta name="description" content="左写右看：Markdown 编辑与实时预览，原生 HTML、数学公式、语法高亮、滚动同步。" />

  <!-- 首屏前确定主题，避免闪白/闪黑 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("md-editor.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="/app.css" />

  <!-- MathJax v4 配置：在默认 \(...\) \[...\] 之外追加 $...$ 行内定界符（与参考页一致） -->
  <script>
    window.MathJax = {
      tex: { inlineMath: { "[+]": [["$", "$"]] } }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
</head>
<body>
  <main id="app">
    <section id="editorPane" aria-label="编辑器">
      <div id="toolbar" role="toolbar" aria-label="编辑工具">
        <button id="btnFormat" type="button" class="tb-btn" title="美化 HTML 缩进；无 HTML 时清理多余空白">格式化</button>
        <button id="btnWrap" type="button" class="tb-btn active" title="自动换行（默认开）；关闭后长行横向滚动">自动换行</button>
        <button id="btnCopy" type="button" class="tb-btn" title="复制编辑器的全部内容到剪贴板">复制</button>
        <span id="tbStatus" aria-live="polite"></span>
      </div>
      <textarea
        id="editor"
        wrap="off"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        placeholder="在这里书写 Markdown…&#10;&#10;原生 HTML（如 &lt;table&gt;&lt;tr&gt;&lt;td&gt;…&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;）与数学公式（\(E=mc^2\)、$x^2$、$$x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}$$）都会实时渲染。&#10;&#10;粘贴 HTML 后点上方「格式化」可自动排版。"
      ></textarea>
    </section>

    <div
      id="divider"
      role="separator"
      aria-orientation="vertical"
      aria-label="拖动调整左右宽度，双击复位"
      title="拖动调整 · 双击复位 50/50"
    >
      <span id="grip" aria-hidden="true"></span>
    </div>

    <section id="previewPane" aria-label="预览">
      <article id="preview" class="markdown-body"></article>
    </section>

    <button id="themeToggle" type="button" aria-label="切换亮暗主题" title="切换亮暗主题">
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.4 14.1A8.5 8.5 0 0 1 9.9 3.6a8.5 8.5 0 1 0 10.5 10.5Z" />
      </svg>
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.5v2M12 19.5v2M4.34 4.34l1.42 1.42M18.24 18.24l1.42 1.42M2.5 12h2M19.5 12h2M4.34 19.66l1.42-1.42M18.24 5.76l1.42-1.42" />
      </svg>
    </button>
  </main>

  <script src="/app.js"></script>
</body>
</html>
